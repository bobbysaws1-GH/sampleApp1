apiVersion: apps/v1
kind: Deployment

metadata:
  name: myapp-deployment

spec:
  replicas: 4

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp

    spec:
      containers:
      - name: myapp-container
        image: bobbysdocker/mystaticappimage:v1.0

        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service

metadata:
  name: myapp-service

spec:
  type: LoadBalancer

  selector:
    app: myapp

  ports:
  - port: 80
    targetPort: 80
